[project]
name = "tinyml"
version = "0.1.0"
description = "Goal-first TinyML: from a sentence and a CSV to a verified C library and a chip ranking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.scripts]
tinyml = "tinyml.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emulator: needs a cross toolchain and QEMU (skipped when missing)",
    "espidf: needs ESP-IDF and Espressif QEMU (skipped when missing)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: Typer and FastAPI declare parameters through defaults

[tool.ruff.lint.per-file-ignores]
"src/tinyml/packaging/check_parity.py" = ["B905"]  # shipped script must run on older Python 3
