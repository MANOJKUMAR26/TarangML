# Hand-edited V1 chip catalog (PRD section 8).
# Prices are rough 1k-unit chip prices and power figures are rounded datasheet typicals.
# Both are always shown to users as "estimated". Memory sizes and cores are from datasheets.

vendors:
  - id: espressif
    name: Espressif
  - id: st
    name: STMicroelectronics
  - id: nordic
    name: Nordic Semiconductor
  - id: raspberrypi
    name: Raspberry Pi

cores:
  xtensa-lx7f:
    arch: xtensa
    fpu: single
    description: Xtensa LX7 with single-precision FPU
  rv32imc:
    arch: riscv
    fpu: none
    description: RISC-V RV32IMC, no FPU
  cortex-m4f:
    arch: arm
    fpu: single
    gcc_flags: [-mcpu=cortex-m4, -mthumb, -mfpu=fpv4-sp-d16, -mfloat-abi=hard]
    qemu_machine: mps2-an386
    description: Arm Cortex-M4 with single-precision FPU
  cortex-m33f:
    arch: arm
    fpu: single
    gcc_flags: [-mcpu=cortex-m33, -mthumb, -mfpu=fpv5-sp-d16, -mfloat-abi=hard]
    qemu_machine: mps2-an505
    description: Arm Cortex-M33 with single-precision FPU
  cortex-m0plus:
    arch: arm
    fpu: none
    gcc_flags: [-mcpu=cortex-m0plus, -mthumb, -mfloat-abi=soft]
    qemu_machine: mps2-an385
    description: Arm Cortex-M0+, no FPU
  rv32imc-generic:
    arch: riscv
    fpu: none
    gcc_flags: [-march=rv32imc, -mabi=ilp32]
    qemu_machine: virt
    description: RISC-V RV32IMC core on the QEMU virt board

chips:
  - id: esp32s3
    vendor: espressif
    family: ESP32-S3
    part_number: ESP32-S3FN8
    core: xtensa-lx7f
    clock_mhz: 240
    ram_kb: 512
    flash_kb: 8192
    radios: [wifi, ble]
    active_ma: 40.0
    sleep_ma: 0.24
    price_usd: 2.20
    lifecycle: active
    backend: espidf
    idf_target: esp32s3
    fallback_backend: null
    emulator: {name: Espressif QEMU, machine: esp32s3, fidelity: chip}
    cpi: {value: 1.25, source: estimated}
    toolchain_image: espressif/idf:v5.5.6
    onboarding: emulated
    notes: Wi-Fi and Bluetooth LE built in; vector instructions for DSP.

  - id: esp32c3
    vendor: espressif
    family: ESP32-C3
    part_number: ESP32-C3FH4
    core: rv32imc
    clock_mhz: 160
    ram_kb: 400
    flash_kb: 4096
    radios: [wifi, ble]
    active_ma: 20.0
    sleep_ma: 0.13
    price_usd: 1.10
    lifecycle: active
    backend: espidf
    idf_target: esp32c3
    fallback_backend: riscv
    fallback_core: rv32imc-generic
    emulator: {name: Espressif QEMU, machine: esp32c3, fidelity: chip}
    cpi: {value: 1.35, source: estimated}
    toolchain_image: espressif/idf:v5.5.6
    onboarding: emulated
    notes: Cheapest Wi-Fi option, but no FPU so float maths is done in software.

  - id: stm32f411
    vendor: st
    family: STM32F4
    part_number: STM32F411CEU6
